# Compila la APK de prueba de la app nativa (carpeta migracion/).
# Todo ocurre aquí: en el equipo de desarrollo no hay SDK de Android ni Gradle.
name: APK de pruebas

on:
  push:
    branches: [pruebas-app]
    paths: ['migracion/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: migracion

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Preparar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.11.1'

      - name: Pruebas del núcleo
        run: gradle --no-daemon test

      - name: Compilar la APK
        run: gradle --no-daemon assembleDebug

      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tpv-stand-apk
          path: migracion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
